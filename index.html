<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlotSnap - Instant Spatial Analyzer</title>
    <style>
        :root {
            --primary: #0b2240;
            --primary-hover: #17345c;
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #333333;
            --accent: #e4a834;
            --brand-blue: #0550c6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 550px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 4px 30px rgba(0,0,0,0.05); border: 1px solid #eef2f5; }
        h1 { font-size: 28px; text-align: center; color: var(--primary); font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
        h1 span { color: var(--brand-blue); }
        .subtitle { font-size: 13px; text-align: center; color: #777; margin-bottom: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Plot<span>Snap</span></h1>
        <div class="subtitle">Instant Pre-Blueprint Spatial Analyzer</div>
        <p>The complete application code for PlotSnap is configured for instant spatial and structural plotting analyses.</p>
    </div>
</body>
</html>
